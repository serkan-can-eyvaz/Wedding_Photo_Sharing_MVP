spring.application.name=wedding-share-backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=PT8H
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:}
app.public-base-url=${APP_PUBLIC_BASE_URL:}
app.r2.endpoint=${R2_ENDPOINT:}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.bucket=${R2_BUCKET:}
