app.jwt.secret=test-jwt-secret-with-at-least-32-bytes
app.jwt.access-token-ttl=PT8H
app.cors.allowed-origin=http://localhost:5173
app.public-base-url=https://wedding.example///
app.r2.endpoint=https://example.invalid
app.r2.access-key-id=test-r2-access-key
app.r2.secret-access-key=test-r2-secret-key
app.r2.bucket=test-r2-bucket
